name: Build DLL

on:
  push:
    branches: [main, rust-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-dll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc-posix
      CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc-posix
      CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++-posix
      CXXSTDLIB_x86_64_pc_windows_gnu: static=stdc++
      MANNY_RUST_CMAKE_GENERATOR: Ninja
      MANNY_RUST_CMAKE_TOOLCHAIN: ${{ github.workspace }}/cmake/toolchains/rust-mingw-x64.cmake
      MANNY_TWITCH_CLIENT_ID: ${{ vars.MANNY_TWITCH_CLIENT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes mingw-w64 ninja-build python3-venv ripgrep
          python3 -m venv "$RUNNER_TEMP/manny-build-tools"
          "$RUNNER_TEMP/manny-build-tools/bin/pip" install cmake==3.31.6
          echo "$RUNNER_TEMP/manny-build-tools/bin" >> "$GITHUB_PATH"

      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-gnu

      - name: Configure static MinGW runtimes
        run: |
          library="$(x86_64-w64-mingw32-g++-posix -print-file-name=libstdc++.a)"
          test -f "$library"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS=-Lnative=$(dirname "$library") -C link-arg=-static-libgcc -C link-arg=-static-libstdc++" >> "$GITHUB_ENV"

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          key: mingw-cmake-3.31.6

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Lint Windows target
        run: cargo +stable clippy --locked --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings

      - name: Test portable core
        run: cargo +stable test --locked -p manny-uploader --target x86_64-unknown-linux-gnu

      - name: Test validation tooling
        run: python3 -m unittest discover -s tests/tools

      - name: Build release DLL
        run: cargo +stable build --locked -p manny-uploader-addon --release --target x86_64-pc-windows-gnu

      - name: Strip embedded debug information
        run: x86_64-w64-mingw32-strip --strip-debug target/x86_64-pc-windows-gnu/release/manny_uploader.dll

      - name: Verify standalone DLL and notices
        run: |
          dll=target/x86_64-pc-windows-gnu/release/manny_uploader.dll
          x86_64-w64-mingw32-objdump -p "$dll" > "$RUNNER_TEMP/manny-pe.txt"
          rg 'DLL Name:' "$RUNNER_TEMP/manny-pe.txt"
          if rg -i 'DLL Name:.*(libgcc|libstdc\+\+|libwinpthread)' "$RUNNER_TEMP/manny-pe.txt"; then
            echo 'The addon requires a companion MinGW runtime DLL' >&2
            exit 1
          fi
          cmake "-DMANNY_DLL_FILE=$dll" -DMANNY_NOTICES_FILE=THIRD_PARTY_NOTICES.md -P cmake/VerifyWindowsNotices.cmake

      - name: Upload DLL
        uses: actions/upload-artifact@v7
        with:
          name: manny-uploader-${{ github.sha }}
          path: target/x86_64-pc-windows-gnu/release/manny_uploader.dll
          if-no-files-found: error
