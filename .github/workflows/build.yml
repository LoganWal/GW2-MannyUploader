name: Build DLL

on:
  push:
    branches: [main, rust-migration, msvc-build]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-dll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MANNY_TWITCH_CLIENT_ID: ${{ vars.MANNY_TWITCH_CLIENT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set Nexus version
        shell: pwsh
        run: |
          cmake -DMANNY_WRITE_GITHUB_ENV=ON -P cmake/ComputeNexusVersion.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Nexus version ordering
        run: cmake -P tests/cmake/nexus_version_test.cmake

      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Lint Windows target
        run: cargo +stable clippy --locked --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Test Rust Release
        env:
          MANNY_REQUIRE_NATIVE_DPAPI: '1'
        run: cargo +stable test --locked --workspace --release --target x86_64-pc-windows-msvc

      - name: Build release DLL
        run: cargo +stable build --locked -p manny-uploader-addon --release --target x86_64-pc-windows-msvc

      - name: Verify and package MSVC DLL
        shell: pwsh
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Sort-Object -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'Microsoft dumpbin was not found' }
          cmake -S rust/package -B out/build/rust-package "-DMANNY_RUST_RELEASE_DIRECTORY=$pwd/target/x86_64-pc-windows-msvc/release" "-DMANNY_DUMPBIN_EXECUTABLE=$dumpbin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cpack --config out/build/rust-package/CPackConfig.cmake -C Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake '-DMANNY_PACKAGE_OUTPUT_DIRECTORY=out/build/rust-package/package' '-DMANNY_PACKAGE_EXTRACT_DIRECTORY=out/build/rust-package/package-verified' -P cmake/VerifyWindowsPackage.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test packaged DLL
        shell: pwsh
        run: |
          $env:MANNY_SMOKE_DLL = (Resolve-Path -LiteralPath out/build/rust-package/package-verified/manny_uploader.dll).Path
          cargo +stable test --locked -p manny-uploader-addon --target x86_64-pc-windows-msvc --lib -- --ignored --exact runtime::tests::dll_smoke::real_dll_smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload verified DLL
        uses: actions/upload-artifact@v7
        with:
          name: manny-uploader-${{ github.sha }}
          path: out/build/rust-package/package-verified/manny_uploader.dll
          if-no-files-found: error
