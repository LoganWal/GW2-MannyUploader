name: Release validation

on:
  workflow_dispatch:
    inputs:
      run_live_https_probe:
        description: Run the public Schannel HTTPS probe
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version-check:
    name: Nexus version ordering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cmake -P tests/cmake/nexus_version_test.cmake

  rust-core:
    name: Rust core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Test Rust Debug
        env:
          MANNY_REQUIRE_NATIVE_DPAPI: ${{ runner.os == 'Windows' && '1' || '' }}
        run: cargo +stable test --locked --workspace --target ${{ matrix.target }}
      - name: Check lifecycle instrumentation
        if: runner.os == 'Windows'
        run: cargo +stable clippy --locked --workspace --all-targets --target x86_64-pc-windows-msvc --features manny-uploader-addon/lifecycle-test -- -D warnings
      - name: Test Rust Release
        env:
          MANNY_REQUIRE_NATIVE_DPAPI: ${{ runner.os == 'Windows' && '1' || '' }}
        run: cargo +stable test --locked --workspace --release --target ${{ matrix.target }}

  windows-release-package:
    name: Windows x64 release package
    needs: [version-check, rust-core]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - name: Set Nexus and package version
        shell: pwsh
        run: |
          cmake -DMANNY_WRITE_GITHUB_ENV=ON -P cmake/ComputeNexusVersion.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Rust Debug and Release DLLs
        env:
          MANNY_TWITCH_CLIENT_ID: ${{ vars.MANNY_TWITCH_CLIENT_ID }}
        shell: pwsh
        run: |
          cargo +stable build --locked -p manny-uploader-addon --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable build --locked -p manny-uploader-addon --target x86_64-pc-windows-msvc --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test Rust DLLs
        shell: pwsh
        run: |
          foreach ($configuration in @('debug', 'release')) {
            $dll = "target/x86_64-pc-windows-msvc/$configuration/manny_uploader.dll"
            $env:MANNY_SMOKE_DLL = (Resolve-Path -LiteralPath $dll).Path
            cargo +stable test --locked -p manny-uploader-addon --target x86_64-pc-windows-msvc --lib -- --ignored --exact runtime::tests::dll_smoke::real_dll_smoke
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Prove unload during active provider work
        shell: pwsh
        run: |
          $arguments = @('--locked', '-p', 'manny-uploader-addon', '--target', 'x86_64-pc-windows-msvc', '--target-dir', 'target/lifecycle-test', '--features', 'lifecycle-test')
          cargo +stable build @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable build @arguments --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MANNY_SMOKE_ACTIVE = '1'
          foreach ($configuration in @('debug', 'release')) {
            $dll = "target/lifecycle-test/x86_64-pc-windows-msvc/$configuration/manny_uploader.dll"
            $env:MANNY_SMOKE_DLL = (Resolve-Path -LiteralPath $dll).Path
            cargo +stable test --locked -p manny-uploader-addon --target x86_64-pc-windows-msvc --target-dir target/lifecycle-test --features lifecycle-test --lib -- --ignored --exact runtime::tests::dll_smoke::real_dll_smoke
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run opt-in Schannel HTTPS probe
        if: ${{ inputs.run_live_https_probe }}
        env:
          MANNY_HTTP_LIVE_PROBE: '1'
          MANNY_REQUIRE_NATIVE_DPAPI: '1'
        run: cargo +stable test --locked -p manny-uploader-addon --target x86_64-pc-windows-msvc -- --ignored live_schannel_https_probe
      - name: Verify real DLL and PDB matching
        shell: pwsh
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Sort-Object -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'Microsoft dumpbin was not found' }
          cmake "-DMANNY_DLL_FILE=$pwd/target/x86_64-pc-windows-msvc/release/manny_uploader.dll" "-DMANNY_SYMBOL_FILE=$pwd/target/x86_64-pc-windows-msvc/release/manny_uploader.pdb" "-DMANNY_OTHER_SYMBOL_FILE=$pwd/target/x86_64-pc-windows-msvc/debug/manny_uploader.pdb" "-DMANNY_DUMPBIN_EXECUTABLE=$dumpbin" "-DMANNY_TEST_ROOT=$pwd/out/build/rust-symbol-match" -P tests/cmake/windows_symbol_match_integration_test.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure and verify shipping Rust package
        shell: pwsh
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Sort-Object -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'Microsoft dumpbin was not found' }
          cmake -S rust/package -B out/build/rust-package "-DMANNY_RUST_RELEASE_DIRECTORY=$pwd/target/x86_64-pc-windows-msvc/release" "-DMANNY_DUMPBIN_EXECUTABLE=$dumpbin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cpack --config out/build/rust-package/CPackConfig.cmake -C Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake '-DMANNY_PACKAGE_OUTPUT_DIRECTORY=out/build/rust-package/package' '-DMANNY_PACKAGE_EXTRACT_DIRECTORY=out/build/rust-package/package-verified' -P cmake/VerifyWindowsPackage.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = 'out/build/rust-package/package-verified/manny_uploader.dll'
          $env:MANNY_SMOKE_DLL = (Resolve-Path -LiteralPath $dll).Path
          cargo +stable test --locked -p manny-uploader-addon --target x86_64-pc-windows-msvc --lib -- --ignored --exact runtime::tests::dll_smoke::real_dll_smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake "-DMANNY_DLL_FILE=$dll" '-DMANNY_NOTICES_FILE=THIRD_PARTY_NOTICES.md' -P cmake/VerifyWindowsNotices.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified release package
        uses: actions/upload-artifact@v7
        with:
          name: GW2-Manny-Uploader-windows-x64
          path: |
            out/build/rust-package/package/*.zip
            out/build/rust-package/package/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload verified debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: GW2-Manny-Uploader-windows-x64-symbols
          path: |
            out/build/rust-package/symbols/Release/manny_uploader.pdb
            out/build/rust-package/symbols/Release/manny_uploader.pdb.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
