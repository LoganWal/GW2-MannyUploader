[package]
name = "manny-uploader"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Logan"]
description = "GW2 Manny Uploader core"
publish = false

[workspace]
members = ["rust/addon"]
default-members = ["."]
resolver = "3"

[lib]
path = "rust/src/lib.rs"

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
crc32fast = "=1.5.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }

[[test]]
name = "upload_job"
path = "rust/tests/upload_job.rs"

[[test]]
name = "upload_coordinator"
path = "rust/tests/upload_coordinator.rs"

[[test]]
name = "async_upload_worker"
path = "rust/tests/async_upload_worker.rs"

[[test]]
name = "metadata_decoder"
path = "rust/tests/metadata_decoder.rs"

[[test]]
name = "zevtc_archive"
path = "rust/tests/zevtc_archive.rs"

[[test]]
name = "metadata_ingestion"
path = "rust/tests/metadata_ingestion.rs"

[lints.rust]
unsafe_code = "forbid"

[[test]]
name = "log_discovery"
path = "rust/tests/log_discovery.rs"

[[test]]
name = "application_pump"
path = "rust/tests/application_pump.rs"

