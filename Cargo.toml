[package]
name = "manny-uploader"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Logan"]
description = "GW2 Manny Uploader core"
publish = false

[workspace]
members = ["rust/addon"]
default-members = ["."]
resolver = "3"

[lib]
path = "rust/src/lib.rs"

[[test]]
name = "upload_job"
path = "rust/tests/upload_job.rs"

[[test]]
name = "upload_coordinator"
path = "rust/tests/upload_coordinator.rs"

[[test]]
name = "async_upload_worker"
path = "rust/tests/async_upload_worker.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
